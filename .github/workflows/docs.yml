name: Documentation

on:
  pull_request:
  push:
    branches:
      - master
      - develop
      - ci-debug
  schedule:
    - cron: "0 12 * * 0"

jobs:
  docsbuild:
    name: Build documentation
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: svg
      PYDEVD_DISABLE_FILE_VALIDATION: 1
    strategy:
      fail-fast: false

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: 3.13
    - name: Install pandoc
      run: sudo apt-get install pandoc
    - name: Install dependencies
      run: |
        uv sync --group docs --all-extras
        uv pip install "./tools/odbclient"
    - name: Build docs
      run: uv run sphinx-build -W -b html docs _build/html
    - name: Validate docstring style (numpydoc)
      run: uv run python docs/validate_docstrings.py --baseline docs/docstring_baseline.txt --min-coverage 100
    - name: Run docstring examples
      run: uv run pytest --doctest-modules src/pylife -q
    - name: Upload docs
      uses: actions/upload-artifact@v7
      with:
        name: docs
        path: ./_build/html
